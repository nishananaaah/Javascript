<body>
    <script>
         
        const promise1=new Promise((resolve,reject)=>{
    reject("failed")
});
const promise2=new Promise((resolve,reject)=>{
    resolve("happy")
});
const allpromise =Promise.race([promise1,promise2]);
allpromise.then((response)=>{
    console.log(response)
}).catch((error)=>{
    console.log(error)
})
//promise race return a single promise it has check the only the first promise
    </script>
</body>
